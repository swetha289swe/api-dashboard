[project]
name = "api-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "swetha", email = "swetha.289swe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlmodel>=0.0.45",
    "uvicorn>=0.53.0",
]

[project.scripts]
api-dashboard = "api_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
